<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LMS Portfolio Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eaf3ff,#fff);display:flex;align-items:center;justify-content:center}.page{width:min(100%,1100px);min-height:640px;margin:20px;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(11,54,105,.22);background:#fff;display:grid;grid-template-columns:1.25fr .75fr}.hero{background:linear-gradient(90deg,rgba(3,39,94,.96),rgba(7,65,132,.82)),url('/static/images/lms_header.jpeg') center/cover no-repeat;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end}.hero h1{font-size:38px;margin:0 0 10px}.hero p{font-size:16px;color:#ffd21c;font-weight:900}.panel{padding:45px 38px;display:flex;flex-direction:column;justify-content:center}.panel h2{color:#052d70;margin:0 0 6px;font-size:27px}.panel .sub{color:#68798d;margin-bottom:24px}.group{margin-bottom:16px}.group label{display:block;font-weight:900;color:#29496d;margin-bottom:6px}.group input{width:100%;padding:13px;border:1px solid #cbd9e8;border-radius:8px;font-size:15px}.login{width:100%;border:0;border-radius:8px;padding:13px;background:#0b55b5;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.error{background:#fff1f1;border:1px solid #f1b6b6;color:#b21e1e;padding:10px;border-radius:8px;margin-bottom:14px;font-size:13px}.note{text-align:center;margin-top:15px;color:#718094;font-size:12px}@media(max-width:800px){.page{grid-template-columns:1fr}.hero{min-height:240px;padding:28px}.hero h1{font-size:28px}.panel{padding:30px}}
</style></head><body><div class="page"><section class="hero"><h1>LATIN MANHARLAL SECURITIES PVT. LTD.</h1><p>LMS PORTFOLIO MANAGEMENT SYSTEM</p></section><section class="panel"><h2>Secure Login</h2><div class="sub">Client or Supervisor/Admin access</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><div class="group"><label>Client ID / Supervisor ID</label><input name="userid" placeholder="Enter Client ID or Supervisor ID" required></div><div class="group"><label>Password</label><input type="password" name="password" placeholder="Enter Password" required></div><button class="login" type="submit">LOGIN</button></form><div class="note">Client default password = Client ID · Supervisor password = Supervisor ID · Main Admin: admin · Login is case-insensitive</div></section></div></body></html>
